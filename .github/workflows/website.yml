name: Website

# Publishes https://knowtific.github.io/helppuff/ to GitHub Pages: the landing
# page, the docs (rendered from wiki/, the same files the GitHub wiki shows)
# and the widget playground at /playground/. One-time setup: in the
# repository's Settings → Pages, set Source to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'website/**'
      - 'packages/widget/**'
      - 'packages/protocol/**'
      - 'packages/connectors/echo/**'
      - 'packages/connectors/_types/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The playground (production widget bundle, size budgets enforced), then the site around it.
      - run: pnpm build:website

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
