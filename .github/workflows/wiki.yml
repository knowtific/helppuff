name: Wiki

# Publishes wiki/ to the repository's GitHub wiki, so the docs are edited and
# reviewed in pull requests like the code. One-time setup: enable the wiki in
# the repository settings and create any first page there (GitHub only
# creates the wiki's git repository then); this job replaces it.

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish wiki/ to the GitHub wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"; then
            echo "::error::The GitHub wiki has not been initialized. Open the repository's Wiki tab, create and save the first page once, then rerun this workflow."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'Wiki already up to date.'; exit 0; fi
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
