<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HelpPuff preview</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233B0D24'/%3E%3Cg transform='translate(6.4 6.4) scale(.8)'%3E%3Cpath fill='%23E4F568' d='M32 5.5a19 19 0 1 1 0 38a19 19 0 1 1 0-38ZM32 17a7.5 7.5 0 1 0 0 15a7.5 7.5 0 1 0 0-15ZM13 24.5H24V41.5L13 47.5ZM11 49a5 5 0 1 1 0 10a5 5 0 1 1 0-10Z'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: light; --ink: #17171d; --ink-2: #5d5d68; --ink-3: #8c8c96; --line: #e4e4de; --card: #fff; --brand: #5b5bf7; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: #f4f4f1;
      }
      /* The widget's panel sits in one corner: keep the controls clear of it. */
      main { padding: 28px 28px 120px; max-width: 760px; }
      body[data-side="right"] main { margin-right: 440px; }
      body[data-side="left"] main { margin-left: 440px; }
      /* At 640px and below the open chat is full screen, so there is nothing to keep clear of. */
      @media (max-width: 640px) { body[data-side] main { margin: 0; max-width: none; padding: 20px 16px 120px; } }

      h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 4px; }
      .lede { margin: 0 0 22px; color: var(--ink-2); font-size: 14px; }
      h2 { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 26px 0 10px; }
      .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
      .try {
        display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
        padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
        font: inherit; color: inherit; cursor: pointer; transition: border-color 120ms, transform 120ms;
      }
      .try:hover { border-color: var(--brand); }
      .try:active { transform: translateY(1px); }
      .try b { font-size: 14px; font-weight: 600; }
      .try span { font-size: 12.5px; color: var(--ink-2); }
      .try code, .api code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--brand); }
      .api { display: flex; flex-wrap: wrap; gap: 6px; }
      .api button {
        padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer;
      }
      .api button:hover { border-color: var(--brand); }
      .note { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-3); }
      .note button { font: inherit; color: var(--brand); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
      #log {
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-2); background: var(--card);
        border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; max-height: 220px; overflow: auto;
      }
      #log div { padding: 2px 0; border-bottom: 1px solid #f0f0ec; word-break: break-all; }
      #log div:last-child { border-bottom: 0; }
      #log .muted { color: var(--ink-3); }
      :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main id="controls"></main>
    <script type="module" src="/demo/preview.ts"></script>
  </body>
</html>
