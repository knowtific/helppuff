<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HelpPuff playground</title>
    <meta name="description" content="Try every option of the HelpPuff chat widget live: brand, launcher, teaser, home screen, lead form, chat, styles, and export the config." />
    <style>
      :root {
        color-scheme: light;
        --ink: #16161d;
        --ink-2: #5d5d69;
        --ink-3: #8b8b96;
        --paper: #f7f7f8;
        --card: #ffffff;
        --sunk: #f0f0f2;
        --line: rgba(15, 15, 25, 0.1);
        --line-2: rgba(15, 15, 25, 0.18);
        --brand: #5b5bf7;
        --brand-ink: #3d3dd6;
        --danger: #c0392b;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --ink: #f1f1f4;
          --ink-2: #a5a5b0;
          --ink-3: #75757f;
          --paper: #0d0d11;
          --card: #16161c;
          --sunk: #1d1d24;
          --line: rgba(255, 255, 255, 0.09);
          --line-2: rgba(255, 255, 255, 0.16);
          --brand-ink: #9d9dff;
          --danger: #ff7b6b;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--brand-ink); }
      code { font-family: var(--mono); font-size: 12px; }
      button, input, select, textarea { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

      .app { display: flex; flex-direction: column; min-height: 100%; }

      .top {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
        padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card);
      }
      .top h1 { font-size: 17px; letter-spacing: -0.01em; margin: 0; }
      .top p { margin: 0; color: var(--ink-2); font-size: 13px; }
      .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; font-size: 13px; }
      .top-actions a { text-decoration: none; }
      .top-actions a:hover { text-decoration: underline; }
      .preset { display: flex; align-items: center; gap: 8px; color: var(--ink-2); white-space: nowrap; }
      .preset select { width: auto; }
      .top h1 { display: flex; align-items: center; gap: 6px; }
      .top h1 .home { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; }
      .top h1 .home:hover { color: var(--brand-ink); }
      .top h1 .home svg { width: 20px; height: 20px; }

      .layout {
        flex: 1; display: grid; grid-template-columns: minmax(320px, 420px) 1fr; min-height: 0;
      }
      .panel {
        border-right: 1px solid var(--line); background: var(--card);
        display: flex; flex-direction: column; min-height: 0; height: calc(100vh - 66px); position: sticky; top: 0;
      }
      .tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
      .tabs button {
        border: 0; background: none; padding: 8px 10px 10px; cursor: pointer; color: var(--ink-2);
        border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500;
        display: inline-flex; align-items: center; gap: 6px;
      }
      .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
      .badge { background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; line-height: 17px; }
      .tab-body { overflow-y: auto; flex: 1; padding: 6px 16px 40px; }

      .section { border-bottom: 1px solid var(--line); }
      .section summary {
        cursor: pointer; padding: 12px 0; font-weight: 600; list-style: none;
        display: flex; justify-content: space-between; align-items: center;
      }
      .section summary::-webkit-details-marker { display: none; }
      .section summary::after { content: '+'; color: var(--ink-3); font-weight: 400; font-size: 16px; }
      .section[open] summary::after { content: '–'; }
      .section-body { padding: 0 0 14px; display: grid; gap: 14px; }

      .field { display: grid; gap: 6px; }
      .label { font-weight: 500; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
      .path { color: var(--ink-3); font-size: 11px; font-weight: 400; }
      .hint { margin: 0; color: var(--ink-2); font-size: 12px; }
      .muted { color: var(--ink-3); }
      input[type="text"], input[type="search"], select, textarea {
        width: 100%; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card);
        padding: 7px 10px; min-height: 34px;
      }
      textarea { resize: vertical; }
      input::placeholder, textarea::placeholder { color: var(--ink-3); }

      .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--sunk); width: fit-content; max-width: 100%; flex-wrap: wrap; }
      .seg button { border: 0; background: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
      .seg button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

      .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
      .switch input {
        appearance: none; width: 32px; height: 18px; border-radius: 999px; background: var(--line-2);
        position: relative; flex: none; margin: 0; cursor: pointer; transition: background 120ms;
      }
      .switch input::after {
        content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
        background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 120ms;
      }
      .switch input:checked { background: var(--brand); }
      .switch input:checked::after { transform: translateX(14px); }

      .slider { display: flex; align-items: center; gap: 10px; }
      .slider input { flex: 1; accent-color: var(--brand); }
      .slider output { font-family: var(--mono); font-size: 12px; color: var(--ink-2); min-width: 48px; text-align: right; }

      .color { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .color input[type="color"] { width: 40px; height: 32px; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--card); cursor: pointer; }
      .swatches { display: flex; gap: 6px; }
      .swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line-2); cursor: pointer; padding: 0; }
      .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

      .checks { display: grid; gap: 6px; }
      .check { display: flex; align-items: center; gap: 8px; }
      .check input { accent-color: var(--brand); margin: 0; }
      .check .muted { font-size: 12px; }

      .json { display: grid; gap: 10px; padding-top: 10px; }
      .json textarea { font-family: var(--mono); font-size: 12px; line-height: 1.5; min-height: 60vh; white-space: pre; }
      .problem { margin: 0; color: var(--danger); font-size: 12px; font-family: var(--mono); }

      .reference { display: grid; gap: 10px; padding-top: 10px; }
      .reference dl { margin: 0; }
      .ref-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
      .ref-row dt { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
      .ref-row dt code { font-weight: 600; color: var(--ink); }
      .ref-row .type { font-family: var(--mono); font-size: 11px; color: var(--brand-ink); }
      .ref-row .default { font-size: 11px; color: var(--ink-3); }
      .ref-row dd { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }

      .export h3 { font-size: 14px; margin: 14px 0 6px; }
      .export ol { margin: 0 0 14px; padding-left: 20px; color: var(--ink-2); display: grid; gap: 6px; }
      .copy { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; overflow: hidden; }
      .copy-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--sunk); font-size: 12px; font-weight: 600; }
      .copy-head button { border: 1px solid var(--line-2); background: var(--card); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
      .copy pre { margin: 0; padding: 10px; font-family: var(--mono); font-size: 11.5px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; }

      .stage { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 24px; min-width: 0; }
      .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
      .api { display: flex; flex-wrap: wrap; gap: 6px; }
      .toolbar-hint { margin: 0; flex: 1; text-align: center; color: var(--ink-3); font-size: 12.5px; }
      .api button {
        border: 1px solid var(--line-2); background: var(--card); border-radius: 7px; padding: 4px 9px; cursor: pointer;
      }
      .api button:hover { border-color: var(--brand); }
      .device {
        flex: 1; display: flex; justify-content: center; min-height: 560px;
      }
      .device iframe {
        width: 100%; height: 100%; min-height: 560px; border: 1px solid var(--line-2); border-radius: 12px;
        background: #f4f4f1; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 12px 32px -12px rgba(0,0,0,.18);
      }
      .device.mobile iframe { width: 390px; max-width: 100%; height: 760px; flex: none; border-radius: 28px; border-width: 8px; border-color: #1c1c22; }

      @media (max-width: 860px) {
        .toolbar-hint { display: none; }
        .layout { grid-template-columns: 1fr; }
        .panel { position: static; height: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
        .tab-body { max-height: 60vh; }
        .stage { padding: 16px; }
        .device, .device iframe { min-height: 600px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/demo/playground.tsx"></script>
  </body>
</html>
