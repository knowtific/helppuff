name = "murmur"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# The Anthropic connector's SDK imports Node built-ins.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# For `pnpm dev` only: wrangler simulates KV locally, so the ids are
# placeholders. Real deployments are made by the CLI, which writes its own
# wrangler config. KV holds rate-limit counters, per-session message counts and
# config overrides — no session state and no lead data.
#
# Keep every top-level key above the [tables] below: in TOML a bare key after
# a [section] belongs to that section, which silently moved this binding into
# [assets] the first time round.
kv_namespaces = [
  { binding = "MURMUR_KV", id = "local-dev", preview_id = "local-dev" }
]

[vars]
MURMUR_LOG = "0"

# One Worker serves both halves: the widget bundles as static assets,
# and the protocol at /v1/*. A request matching a built file is served from
# Cloudflare's edge without invoking the Worker; everything else falls
# through to it.
#
# That is why the embed snippet needs no second host — `loader.js` and the
# API share an origin. `data-api` exists for splitting them.
[assets]
directory = "../widget/dist"
not_found_handling = "none"

# Secrets are set with `wrangler secret put`, never written here.
# See packages/server/.dev.vars.example for the full list.
