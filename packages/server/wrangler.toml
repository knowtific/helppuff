name = "murmur"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# `setup.sh` fills in the real id. KV holds rate-limit counters only — no
# session state and no lead data.
kv_namespaces = [
  { binding = "MURMUR_KV", id = "REPLACE_WITH_KV_ID", preview_id = "REPLACE_WITH_KV_PREVIEW_ID" }
]

[vars]
MURMUR_LOG = "0"

# MURMUR_SECRET and any connector/sink secrets are set with:
#   wrangler secret put MURMUR_SECRET
